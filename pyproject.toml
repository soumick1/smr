[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smr"
version = "0.1.0"
description = "Scene mental rotation with emergent attractor dynamics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8",
                "imageio>=2.34", "pyyaml>=6.0", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", "co3d", ".venv", "outputs", "data", "build", "dist"]
